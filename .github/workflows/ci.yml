name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-and-deployment:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PowerShell analyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Test PowerShell deployment scripts
        shell: powershell
        run: .\scripts\Test-PowerShellScripts.ps1 -RunScriptAnalyzer

      - name: Test browser expression and session contracts
        run: node --test tests/frontend/*.test.mjs

      - name: Restore portable projects
        run: dotnet restore tests/TFlexDrawingService.Tests/TFlexDrawingService.Tests.csproj

      - name: Build and test portable projects
        run: dotnet test tests/TFlexDrawingService.Tests/TFlexDrawingService.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Publish Windows API and Worker
        shell: powershell
        run: |
          dotnet publish src/TFlexDrawingService.Api/TFlexDrawingService.Api.csproj -c Release -r win-x64 --self-contained false -o artifacts/api
          if ($LASTEXITCODE -ne 0) { throw "API publish failed." }
          dotnet publish src/TFlexDrawingService.Worker/TFlexDrawingService.Worker.csproj -c Release -r win-x64 --self-contained false -o artifacts/worker
          if ($LASTEXITCODE -ne 0) { throw "Worker publish failed." }

      - name: Verify production publish contents
        shell: powershell
        run: |
          $required = @(
            "artifacts/api/TFlexDrawingService.Api.exe",
            "artifacts/worker/TFlexDrawingService.Worker.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing publish artifact '$path'."
            }
          }
          $developmentSettings = @(
            "artifacts/api/appsettings.Development.json",
            "artifacts/worker/appsettings.Development.json"
          )
          foreach ($path in $developmentSettings) {
            if (Test-Path -LiteralPath $path) {
              throw "Development settings leaked into production publish: '$path'."
            }
          }

      - name: Audit NuGet dependencies
        run: >
          dotnet restore tests/TFlexDrawingService.Tests/TFlexDrawingService.Tests.csproj
          --force-evaluate
          --no-http-cache
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          -warnaserror:NU1903,NU1904
          --verbosity minimal

  windows-api-container:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Windows container engine
        shell: powershell
        run: |
          $dockerService = Get-Service -Name docker -ErrorAction Stop
          if ($dockerService.Status -ne "Running") {
            Start-Service -Name docker
            $dockerService.WaitForStatus("Running", [TimeSpan]::FromSeconds(60))
          }
          $osType = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { throw "docker info failed." }
          if ($osType.Trim() -ne "windows") {
            throw "The CI Docker engine is not configured for Windows containers."
          }

      - name: Free space for Windows base-image layers
        shell: powershell
        run: |
          docker system prune --all --force
          if ($LASTEXITCODE -ne 0) { throw "Docker cleanup failed." }

      - name: Build API Windows container
        shell: powershell
        run: |
          docker build --pull --file Dockerfile.api --tag tflex-drawing-service-api:ci .
          if ($LASTEXITCODE -ne 0) { throw "Windows API container build failed." }

      - name: Inspect API container image
        shell: powershell
        run: |
          $user = docker image inspect tflex-drawing-service-api:ci --format '{{.Config.User}}'
          if ($LASTEXITCODE -ne 0) { throw "Container image inspection failed." }
          if ($user.Trim() -ne "ContainerUser") {
            throw "The API image must run as ContainerUser."
          }
          $health = docker image inspect tflex-drawing-service-api:ci --format '{{json .Config.Healthcheck}}'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($health) -or $health -eq "null") {
            throw "The API image must include a Docker health check."
          }

      - name: Smoke-test Windows container run contract
        shell: powershell
        run: |
          $smokeRoot = "C:\tflex-container-smoke"
          $apiDirectory = Join-Path $smokeRoot "Api"
          $storageDirectory = Join-Path $smokeRoot "storage"
          $templatesDirectory = Join-Path $smokeRoot "templates"
          New-Item -ItemType Directory -Force -Path $apiDirectory, $storageDirectory, $templatesDirectory | Out-Null
          Set-Content -LiteralPath (Join-Path $apiDirectory "appsettings.Production.json") -Value "{}" -Encoding UTF8

          try {
            docker container run --detach `
              --name tflex-drawing-api-run-contract `
              --isolation process `
              --publish 52112:8080 `
              --mount "type=bind,source=$apiDirectory,target=C:\tflex-config,readonly" `
              --mount "type=bind,source=$storageDirectory,target=$storageDirectory" `
              --mount "type=bind,source=$templatesDirectory,target=$templatesDirectory" `
              --entrypoint powershell `
              tflex-drawing-service-api:ci `
              -NoProfile -Command "Start-Sleep -Seconds 30"
            if ($LASTEXITCODE -ne 0) { throw "Windows API container run contract failed." }

            $running = docker container inspect tflex-drawing-api-run-contract --format '{{.State.Running}}'
            if ($LASTEXITCODE -ne 0 -or $running.Trim() -ne "true") {
              throw "Windows API smoke container did not remain running."
            }
          }
          finally {
            docker container rm --force tflex-drawing-api-run-contract 2>$null
          }
